<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FizzBuzz (1〜50)</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --primary: #3b82f6;

      --fizz-color: #2563eb;
      --fizz-bg: #dbeafe;
      --buzz-color: #ea580c;
      --buzz-bg: #ffedd5;
      --fizzbuzz-color: #7c3aed;
      --fizzbuzz-bg: #ede9fe;
      --normal-color: #475569;
      --normal-bg: #f1f5f9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.5;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      padding: 2rem;
    }

    header {
      margin-bottom: 1.5rem;
      text-align: center;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #0f172a;
    }

    .description {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .summary-bar {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
      padding: 0.75rem;
      background: #f8fafc;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-size: 0.85rem;
    }

    .summary-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .summary-count {
      font-weight: 600;
    }

    .table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.95rem;
    }

    thead {
      background-color: #f1f5f9;
      position: sticky;
      top: 0;
    }

    th {
      padding: 0.75rem 1rem;
      font-weight: 600;
      color: #334155;
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background-color: #f8fafc;
    }

    .col-num {
      width: 20%;
      text-align: center;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
    }

    .col-result {
      width: 50%;
      font-weight: 600;
    }

    .col-badge {
      width: 30%;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.025em;
    }

    .badge-fizz {
      background-color: var(--fizz-bg);
      color: var(--fizz-color);
    }

    .badge-buzz {
      background-color: var(--buzz-bg);
      color: var(--buzz-color);
    }

    .badge-fizzbuzz {
      background-color: var(--fizzbuzz-bg);
      color: var(--fizzbuzz-color);
    }

    .badge-normal {
      background-color: var(--normal-bg);
      color: var(--normal-color);
    }

    .text-fizz {
      color: var(--fizz-color);
    }

    .text-buzz {
      color: var(--buzz-color);
    }

    .text-fizzbuzz {
      color: var(--fizzbuzz-color);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>FizzBuzz (1 〜 50)</h1>
      <p class="description">1から50までの数値を判定した結果の一覧表です。</p>
    </header>

    <div class="summary-bar" id="summary-bar">
      <!-- 集計結果がJSで挿入されます -->
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th class="col-num">No.</th>
            <th class="col-result">結果</th>
            <th class="col-badge">タイプ</th>
          </tr>
        </thead>
        <tbody id="fizzbuzz-table-body">
          <!-- JSで動的に行が追加されます -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const tbody = document.getElementById("fizzbuzz-table-body");
      const summaryBar = document.getElementById("summary-bar");
      const fragment = document.createDocumentFragment();

      const counts = {
        total: 50,
        fizz: 0,
        buzz: 0,
        fizzbuzz: 0,
        normal: 0
      };

      for (let i = 1; i <= 50; i++) {
        let text = "";
        let badgeText = "";
        let badgeClass = "";
        let textClass = "";

        if (i % 15 === 0) {
          text = "FizzBuzz";
          badgeText = "FizzBuzz (15の倍数)";
          badgeClass = "badge-fizzbuzz";
          textClass = "text-fizzbuzz";
          counts.fizzbuzz++;
        } else if (i % 3 === 0) {
          text = "Fizz";
          badgeText = "Fizz (3の倍数)";
          badgeClass = "badge-fizz";
          textClass = "text-fizz";
          counts.fizz++;
        } else if (i % 5 === 0) {
          text = "Buzz";
          badgeText = "Buzz (5の倍数)";
          badgeClass = "badge-buzz";
          textClass = "text-buzz";
          counts.buzz++;
        } else {
          text = String(i);
          badgeText = "通常";
          badgeClass = "badge-normal";
          counts.normal++;
        }

        const tr = document.createElement("tr");

        const tdNum = document.createElement("td");
        tdNum.className = "col-num";
        tdNum.textContent = i;

        const tdResult = document.createElement("td");
        tdResult.className = `col-result ${textClass}`;
        tdResult.textContent = text;

        const tdBadge = document.createElement("td");
        tdBadge.className = "col-badge";
        const badge = document.createElement("span");
        badge.className = `badge ${badgeClass}`;
        badge.textContent = badgeText;
        tdBadge.appendChild(badge);

        tr.appendChild(tdNum);
        tr.appendChild(tdResult);
        tr.appendChild(tdBadge);

        fragment.appendChild(tr);
      }

      tbody.appendChild(fragment);

      // サマリーバーの描画
      summaryBar.innerHTML = `
        <div class="summary-item">全件: <span class="summary-count">${counts.total}</span></div>
        <div class="summary-item">Fizz: <span class="summary-count text-fizz">${counts.fizz}</span></div>
        <div class="summary-item">Buzz: <span class="summary-count text-buzz">${counts.buzz}</span></div>
        <div class="summary-item">FizzBuzz: <span class="summary-count text-fizzbuzz">${counts.fizzbuzz}</span></div>
        <div class="summary-item">通常: <span class="summary-count">${counts.normal}</span></div>
      `;
    });
  </script>
</body>
</html>
